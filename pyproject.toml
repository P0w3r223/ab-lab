[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-lab"
# Read from src/ab_lab/__init__.py so the number lives in exactly one place.
dynamic = ["version"]
description = "A 5% test is only 5% if you look once, count each user once, and test one metric - the statistics that catch each case, validated by simulation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ab-testing", "experimentation", "statistics", "power-analysis", "sequential-testing", "monte-carlo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://p0w3r223.github.io/ab-lab/"
Source = "https://github.com/P0w3r223/ab-lab"
Issues = "https://github.com/P0w3r223/ab-lab/issues"
Changelog = "https://github.com/P0w3r223/ab-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# statsmodels is a *test oracle*, not a runtime dependency: the point of the
# package is to implement these methods, so shipping statsmodels alongside them
# would defeat it. See docs/decisions/0001-no-statsmodels-at-runtime.md.
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.100",
    "statsmodels>=0.14",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ab_lab"]

[tool.setuptools.dynamic]
version = { attr = "ab_lab.__version__" }

# Every public function here is annotated; without this marker PEP 561 says a
# consumer's type checker must ignore all of it.
[tool.setuptools.package-data]
ab_lab = ["py.typed"]

[tool.pytest.ini_options]
# "." puts sitegen/ and examples/ on the path: the site generator and the
# scripts that record its evidence are both imported by tests.
pythonpath = ["src", "."]
testpaths = ["tests"]
# The full Monte Carlo re-run is minutes, not seconds, so it is opt-in: every
# pull request gets the cheap guards, and a weekly job runs `pytest -m slow`.
addopts = "-q -m 'not slow'"
markers = [
    "slow: full re-measurement of a recorded finding; the weekly drift check",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
